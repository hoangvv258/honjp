{% extends "base.html" %}

{% block title %}Từ vựng - HonJP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📖 Từ vựng tiếng Nhật</h1>
    <p>Click vào từ vựng để xem chi tiết: ví dụ, Kanji liên quan, từ tương tự</p>
</div>

<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Tìm từ vựng (tiếng Nhật, hiragana, tiếng Việt)...">
    <div class="level-tabs">
        <button class="level-tab all active" data-level="">Tất cả</button>
        {% for lv in levels %}
        <button class="level-tab" data-level="{{ lv }}">{{ lv }}</button>
        {% endfor %}
    </div>
    <div class="bookmark-tabs">
        <button class="bm-tab active" data-bookmark="">📚 Tất cả</button>
        <button class="bm-tab" data-bookmark="review">🔖 Cần ôn lại</button>
        <button class="bm-tab" data-bookmark="learned">✅ Đã học</button>
    </div>
</div>

<div class="card">
    <div id="vocabContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>Đang tải từ vựng...</p>
        </div>
    </div>
    <div id="pagination" class="pagination"></div>
</div>

<!-- Vocab Detail Modal -->
<div id="vocabModal" class="v-modal-overlay" style="display:none;" onclick="if(event.target===this)closeVocabModal()">
    <div class="v-modal-content">
        <button class="v-modal-close" onclick="closeVocabModal()">✕</button>
        <div id="vocabModalBody">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<style>
.v-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,13,26,0.6); backdrop-filter: blur(4px); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: vFadeIn 0.2s ease;
}
@keyframes vFadeIn { from { opacity: 0; } to { opacity: 1; } }
.v-modal-content {
    background: var(--card-solid); border-radius: var(--radius-lg);
    max-width: 620px; width: 92%; max-height: 85vh; overflow-y: auto;
    padding: 40px; position: relative;
    box-shadow: 0 24px 80px rgba(108,99,255,0.18);
    border: var(--glass-border);
    animation: vSlideUp 0.3s ease;
}
@keyframes vSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.v-modal-close {
    position: absolute; top: 14px; right: 18px;
    background: none; border: none; font-size: 1.4rem;
    cursor: pointer; color: var(--text-muted); padding: 4px 8px; border-radius: var(--radius-sm);
    transition: var(--transition);
}
.v-modal-close:hover { background: rgba(108,99,255,0.08); color: var(--primary); }
.v-word-header { text-align: center; margin-bottom: 20px; }
.v-word-main { font-size: 2.8rem; font-weight: 800; color: var(--text); font-family: 'Noto Sans JP', 'Inter', sans-serif; }
.v-word-reading { font-size: 1.15rem; color: var(--text-light); margin-top: 4px; }
.v-word-meaning {
    font-size: 1.1rem; font-weight: 700; margin-top: 10px;
    background: linear-gradient(135deg, var(--primary), var(--warm));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.v-word-type {
    display: inline-block; background: rgba(108,99,255,0.08); border: 1px solid var(--border);
    padding: 4px 14px; border-radius: 20px; font-size: 0.84rem; margin-top: 10px;
    color: var(--primary); font-weight: 600;
}
.v-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.v-section h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--text); font-weight: 700; }
.v-example-box {
    background: var(--warning-light); border-left: 3px solid var(--warning); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 16px 18px; margin-top: 8px;
}
.v-example-box .jp { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 6px; font-family: 'Noto Sans JP', 'Inter', sans-serif; }
.v-example-box .rd { color: var(--text-light); font-size: 0.92rem; margin-bottom: 4px; }
.v-example-box .vi { color: var(--success); font-weight: 600; }
.v-kanji-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(108,99,255,0.05); border: 1px solid var(--border); padding: 10px 14px;
    border-radius: var(--radius-sm); margin: 4px; cursor: pointer; transition: var(--transition);
}
.v-kanji-chip:hover { background: rgba(108,99,255,0.1); border-color: var(--primary); transform: translateY(-2px); }
.v-kanji-chip .k-char { font-size: 1.5rem; font-weight: 700; color: var(--text); font-family: 'Noto Sans JP', sans-serif; }
.v-kanji-chip .k-info { font-size: 0.84rem; color: var(--text-light); }
.vocab-row { cursor: pointer; transition: var(--transition); }
.vocab-row:hover td { background: rgba(108,99,255,0.04) !important; }
.jp-word { font-family: 'Noto Sans JP', 'Inter', sans-serif; font-weight: 700; font-size: 1.1rem; }
.kanji-main { display: block; font-size: 1.2rem; font-weight: 800; color: var(--text); }
.kana-sub { display: block; font-size: 0.82rem; color: var(--text-light); font-weight: 400; margin-top: 2px; }
/* Bookmark tabs */
.bookmark-tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.bm-tab {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); font-size: 0.85rem; cursor: pointer;
    transition: var(--transition); color: var(--text-light); font-weight: 500;
}
.bm-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.bm-tab:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
/* Bookmark buttons in modal */
.bm-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
.bm-btn {
    padding: 8px 18px; border-radius: 20px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: var(--transition); border: 2px solid var(--border);
    background: var(--card);
}
.bm-btn:hover { transform: translateY(-1px); }
.bm-btn.bm-review { color: var(--warning); border-color: var(--warning); }
.bm-btn.bm-review.active, .bm-btn.bm-review:hover { background: var(--warning); color: #fff; }
.bm-btn.bm-learned { color: var(--success); border-color: var(--success); }
.bm-btn.bm-learned.active, .bm-btn.bm-learned:hover { background: var(--success); color: #fff; }
.bm-btn.bm-clear { color: var(--text-muted); border-color: var(--border); }
.bm-btn.bm-clear:hover { background: var(--bg-muted); }
/* Bookmark indicator in table */
.bm-indicator { font-size: 0.8rem; margin-left: 6px; }
</style>
{% endblock %}

{% block scripts %}
<script>
let currentLevel = new URLSearchParams(window.location.search).get('level') || '';
let currentSearch = '';
let currentBookmark = '';
let currentPage = 1;
let searchTimeout;
let bookmarkMap = {};  // id -> 'review' | 'learned'

if (currentLevel) {
    document.querySelectorAll('.level-tab').forEach(t => {
        t.classList.remove('active');
        if (t.dataset.level === currentLevel) t.classList.add('active');
    });
}

// Load all bookmarks for vocabulary
function loadBookmarks() {
    return fetch('/api/bookmark?item_type=vocabulary')
        .then(r => r.json())
        .then(data => { bookmarkMap = {}; for (const [k,v] of Object.entries(data)) bookmarkMap[parseInt(k)] = v; });
}

function loadVocabulary() {
    const content = document.getElementById('vocabContent');
    content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>';
    
    const params = new URLSearchParams({ page: currentPage, per_page: 50 });
    if (currentLevel) params.set('level', currentLevel);
    if (currentSearch) params.set('search', currentSearch);
    if (currentBookmark) params.set('bookmark', currentBookmark);
    
    fetch(`/api/vocabulary?${params}`)
        .then(r => r.json())
        .then(data => {
            if (data.items.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Không tìm thấy từ vựng nào</p></div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            let html = '<table class="data-table"><thead><tr>';
            html += '<th>Từ vựng</th><th>Cách đọc</th><th>Nghĩa</th><th>Loại từ</th><th>Cấp độ</th>';
            html += '</tr></thead><tbody>';
            
            data.items.forEach(item => {
                const hasKanji = /[\u4e00-\u9fff]/.test(item.word);
                const kanjiForm = item.kanji_form || '';
                const bm = bookmarkMap[item.id] || '';
                const bmIcon = bm === 'review' ? '<span class="bm-indicator" title="Cần ôn lại">🔖</span>' : bm === 'learned' ? '<span class="bm-indicator" title="Đã học">✅</span>' : '';
                html += `<tr class="vocab-row" onclick="openVocabDetail(${item.id})">`;
                if (hasKanji) {
                    html += `<td class="jp-word">${esc(item.word)}${bmIcon}</td>`;
                } else if (kanjiForm) {
                    html += `<td class="jp-word"><span class="kanji-main">${esc(kanjiForm)}${bmIcon}</span><span class="kana-sub">${esc(item.word)}</span></td>`;
                } else {
                    html += `<td class="jp-word">${esc(item.word)}${bmIcon}</td>`;
                }
                html += `<td class="reading">${esc(item.reading)}</td>`;
                html += `<td>${esc(item.meaning)}</td>`;
                html += `<td><small>${esc(item.type)}</small></td>`;
                html += `<td><span class="level-badge level-${item.level}">${item.level}</span></td>`;
                html += `</tr>`;
            });
            
            html += '</tbody></table>';
            html += `<p style="margin-top:12px;color:var(--text-light);font-size:0.9em;">Hiển thị ${data.items.length} / ${data.total} từ vựng — Click vào từ để xem chi tiết</p>`;
            content.innerHTML = html;
            
            renderPagination(data.page, data.pages);
        });
}

function openVocabDetail(id) {
    const modal = document.getElementById('vocabModal');
    const body = document.getElementById('vocabModalBody');
    modal.style.display = 'flex';
    body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    document.body.style.overflow = 'hidden';
    
    fetch(`/api/vocabulary/${id}`)
        .then(r => r.json())
        .then(data => {
            let html = '';
            const hasKanjiInWord = /[\u4e00-\u9fff]/.test(data.word);
            const kanjiForm = data.kanji_form || '';
            html += `<div class="v-word-header">`;
            html += `<span class="level-badge level-${data.level}" style="margin-bottom:4px;display:inline-block;">${data.level}</span>`;
            if (hasKanjiInWord) {
                html += `<div class="v-word-main">${esc(data.word)}</div>`;
                if (data.reading) html += `<div class="v-word-reading">${esc(data.reading)}</div>`;
            } else if (kanjiForm) {
                html += `<div class="v-word-main">${esc(kanjiForm)}</div>`;
                html += `<div class="v-word-reading">${esc(data.word)}</div>`;
            } else {
                html += `<div class="v-word-main">${esc(data.word)}</div>`;
                if (data.reading) html += `<div class="v-word-reading">${esc(data.reading)}</div>`;
            }
            html += `<div class="v-word-meaning">🇻🇳 ${esc(data.meaning)}</div>`;
            if (data.type) html += `<div class="v-word-type">${esc(data.type)}</div>`;
            html += `</div>`;
            
            // Example
            if (data.example) {
                html += `<div class="v-section"><h3>📌 Ví dụ thực tế</h3>`;
                html += `<div class="v-example-box">`;
                html += `<div class="jp">${esc(data.example)}</div>`;
                if (data.example_reading) html += `<div class="rd">🔊 ${esc(data.example_reading)}</div>`;
                if (data.example_meaning) html += `<div class="vi">🇻🇳 ${esc(data.example_meaning)}</div>`;
                html += `</div></div>`;
            }
            
            // Related kanji
            if (data.related_kanji && data.related_kanji.length > 0) {
                html += `<div class="v-section"><h3>🈶 Kanji trong từ này</h3>`;
                html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
                data.related_kanji.forEach(k => {
                    html += `<div class="v-kanji-chip" onclick="closeVocabModal();setTimeout(()=>window.location.href='/kanji?search=${encodeURIComponent(k.kanji)}',100)">`;
                    html += `<span class="k-char">${esc(k.kanji)}</span>`;
                    html += `<div><div style="font-weight:600;">${esc(k.meaning)}</div>`;
                    if (k.meaning_vi) html += `<div class="k-info">🇻🇳 ${esc(k.meaning_vi)}</div>`;
                    if (k.onyomi) html += `<div class="k-info">On: ${esc(k.onyomi)}</div>`;
                    if (k.kunyomi) html += `<div class="k-info">Kun: ${esc(k.kunyomi)}</div>`;
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            }
            
            // Similar words
            if (data.similar_words && data.similar_words.length > 0) {
                html += `<div class="v-section"><h3>📚 Từ vựng tương tự</h3>`;
                html += `<div style="display:flex;flex-wrap:wrap;gap:6px;">`;
                data.similar_words.forEach(s => {
                    html += `<div class="v-kanji-chip" onclick="closeVocabModal();setTimeout(()=>openVocabDetail(${s.id}),200)">`;
                    html += `<span style="font-weight:600;">${esc(s.word)}</span>`;
                    if (s.reading) html += `<span class="k-info">(${esc(s.reading)})</span>`;
                    html += `<span class="k-info">→ ${esc(s.meaning)}</span>`;
                    html += `</div>`;
                });
                html += `</div></div>`;
            }
            
            // Bookmark actions
            const curBm = bookmarkMap[data.id] || '';
            html += `<div class="v-section"><h3>📋 Đánh dấu</h3>`;
            html += `<div class="bm-actions">`;
            html += `<button class="bm-btn bm-review${curBm === 'review' ? ' active' : ''}" onclick="setBookmark(${data.id},'review',this)">🔖 Cần ôn lại</button>`;
            html += `<button class="bm-btn bm-learned${curBm === 'learned' ? ' active' : ''}" onclick="setBookmark(${data.id},'learned',this)">✅ Đã học</button>`;
            if (curBm) html += `<button class="bm-btn bm-clear" onclick="setBookmark(${data.id},'',this)">✕ Xóa đánh dấu</button>`;
            html += `</div></div>`;
            
            body.innerHTML = html;
        })
        .catch(() => {
            body.innerHTML = '<p style="text-align:center;color:var(--danger);">Không thể tải dữ liệu</p>';
        });
}

function setBookmark(itemId, status, btn) {
    fetch('/api/bookmark', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({item_type: 'vocabulary', item_id: itemId, status: status})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            if (status) bookmarkMap[itemId] = status;
            else delete bookmarkMap[itemId];
            // Re-open the detail to refresh buttons
            openVocabDetail(itemId);
            // Refresh list to update indicators
            loadVocabulary();
        }
    });
}

function closeVocabModal() {
    document.getElementById('vocabModal').style.display = 'none';
    document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVocabModal(); });

function renderPagination(page, totalPages) {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page-1})">← Trước</button>`;
    const start = Math.max(1, page - 2);
    const end = Math.min(totalPages, page + 2);
    if (start > 1) html += `<button onclick="goPage(1)">1</button>`;
    if (start > 2) html += `<button disabled>...</button>`;
    for (let i = start; i <= end; i++) {
        html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    if (end < totalPages - 1) html += `<button disabled>...</button>`;
    if (end < totalPages) html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="goPage(${page+1})">Sau →</button>`;
    pag.innerHTML = html;
}

function goPage(p) { currentPage = p; loadVocabulary(); window.scrollTo(0, 0); }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.querySelectorAll('.level-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentLevel = tab.dataset.level;
        currentPage = 1;
        loadVocabulary();
    });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentSearch = e.target.value.trim();
        currentPage = 1;
        loadVocabulary();
    }, 300);
});

document.querySelectorAll('.bm-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.bm-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentBookmark = tab.dataset.bookmark;
        currentPage = 1;
        loadVocabulary();
    });
});

// Load bookmarks first, then vocabulary
loadBookmarks().then(() => loadVocabulary());
</script>
{% endblock %}
