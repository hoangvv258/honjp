{% extends "base.html" %}

{% block title %}Hán tự - HonJP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🈶 Hán tự (Kanji)</h1>
    <p>Click vào Kanji để xem chi tiết: bộ thủ, âm on, âm kun, từ vựng liên quan</p>
</div>

<div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Tìm Kanji (chữ Hán, nghĩa Hán Việt, nghĩa Việt)...">
    <div class="level-tabs">
        <button class="level-tab all active" data-level="">Tất cả</button>
        {% for lv in levels %}
        <button class="level-tab" data-level="{{ lv }}">{{ lv }}</button>
        {% endfor %}
    </div>
    <div class="bookmark-tabs">
        <button class="bm-tab active" data-bookmark="">📚 Tất cả</button>
        <button class="bm-tab" data-bookmark="review">🔖 Cần ôn lại</button>
        <button class="bm-tab" data-bookmark="learned">✅ Đã học</button>
    </div>
</div>

<div id="kanjiContent">
    <div class="loading">
        <div class="spinner"></div>
        <p>Đang tải Hán tự...</p>
    </div>
</div>
<div id="pagination" class="pagination"></div>

<!-- Kanji Detail Modal -->
<div id="kanjiModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modalBody">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<style>
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,13,26,0.6); backdrop-filter: blur(4px); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
    background: var(--card-solid); border-radius: var(--radius-lg);
    max-width: 620px; width: 92%; max-height: 85vh; overflow-y: auto;
    padding: 40px; position: relative;
    box-shadow: 0 24px 80px rgba(108,99,255,0.18);
    border: var(--glass-border);
    animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-close {
    position: absolute; top: 14px; right: 18px;
    background: none; border: none; font-size: 1.4rem;
    cursor: pointer; color: var(--text-muted); padding: 4px 8px;
    border-radius: var(--radius-sm); transition: var(--transition);
}
.modal-close:hover { background: rgba(108,99,255,0.08); color: var(--primary); }
.modal-kanji-char { font-size: 5rem; text-align: center; margin: 8px 0; color: var(--text); font-family: 'Noto Sans JP', serif; font-weight: 700; }
.modal-meaning {
    text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(135deg, var(--primary), var(--warm));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.modal-meaning-vi { text-align: center; font-size: 1.05rem; color: var(--text-light); margin-bottom: 16px; }
.modal-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.modal-section h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--text); font-weight: 700; }
.modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-info-item {
    background: rgba(108,99,255,0.04); padding: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
}
.modal-info-item .label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.modal-info-item .value { font-size: 1.05rem; font-weight: 700; color: var(--text); }
.radical-section {
    background: var(--warning-light); border: 1px solid rgba(245,158,11,0.2);
    border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 12px;
}
.radical-section .radical-char { font-size: 2rem; margin-right: 10px; font-family: 'Noto Sans JP', sans-serif; }
.radical-section .radical-info { display: flex; align-items: center; gap: 12px; }
.radical-section .radical-name { font-weight: 700; color: var(--text); }
.radical-section .radical-meaning { color: var(--text-light); font-size: 0.9rem; }
.component-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.component-chip {
    background: rgba(108,99,255,0.05); border: 1px solid var(--border); padding: 8px 14px;
    border-radius: var(--radius-sm); font-size: 0.9rem; transition: var(--transition);
}
.component-chip:hover { border-color: var(--primary); }
.component-chip .comp-char { font-size: 1.3rem; margin-right: 6px; font-family: 'Noto Sans JP', sans-serif; }
.vocab-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(108,99,255,0.04); border: 1px solid var(--border); padding: 8px 14px; border-radius: var(--radius-sm);
    margin: 4px; font-size: 0.9rem; transition: var(--transition);
}
.vocab-chip:hover { background: rgba(108,99,255,0.1); border-color: var(--primary); transform: translateY(-2px); }
.vocab-chip .vword { font-weight: 700; color: var(--text); font-family: 'Noto Sans JP', 'Inter', sans-serif; }
.vocab-chip .vlevel { font-size: 0.72rem; padding: 2px 7px; border-radius: 4px; background: var(--primary); color: white; font-weight: 700; }
.kanji-card .click-hint { margin-top: 8px; text-align: center; color: var(--primary); font-size: 0.85em; font-weight: 500; }
/* Bookmark tabs */
.bookmark-tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.bm-tab {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); font-size: 0.85rem; cursor: pointer;
    transition: var(--transition); color: var(--text-light); font-weight: 500;
}
.bm-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.bm-tab:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
.bm-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
.bm-btn {
    padding: 8px 18px; border-radius: 20px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: var(--transition); border: 2px solid var(--border);
    background: var(--card);
}
.bm-btn:hover { transform: translateY(-1px); }
.bm-btn.bm-review { color: var(--warning); border-color: var(--warning); }
.bm-btn.bm-review.active, .bm-btn.bm-review:hover { background: var(--warning); color: #fff; }
.bm-btn.bm-learned { color: var(--success); border-color: var(--success); }
.bm-btn.bm-learned.active, .bm-btn.bm-learned:hover { background: var(--success); color: #fff; }
.bm-btn.bm-clear { color: var(--text-muted); border-color: var(--border); }
.bm-btn.bm-clear:hover { background: var(--bg-muted); }
.bm-indicator { font-size: 0.7rem; position: absolute; top: 8px; right: 8px; }
</style>
{% endblock %}

{% block scripts %}
<script>
let currentLevel = new URLSearchParams(window.location.search).get('level') || '';
let currentSearch = '';
let currentBookmark = '';
let currentPage = 1;
let searchTimeout;
let bookmarkMap = {};

if (currentLevel) {
    document.querySelectorAll('.level-tab').forEach(t => {
        t.classList.remove('active');
        if (t.dataset.level === currentLevel) t.classList.add('active');
    });
}

function loadBookmarks() {
    return fetch('/api/bookmark?item_type=kanji')
        .then(r => r.json())
        .then(data => { bookmarkMap = {}; for (const [k,v] of Object.entries(data)) bookmarkMap[parseInt(k)] = v; });
}

function loadKanji() {
    const content = document.getElementById('kanjiContent');
    content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>';
    
    const params = new URLSearchParams({ page: currentPage, per_page: 30 });
    if (currentLevel) params.set('level', currentLevel);
    if (currentSearch) params.set('search', currentSearch);
    if (currentBookmark) params.set('bookmark', currentBookmark);
    
    fetch(`/api/kanji?${params}`)
        .then(r => r.json())
        .then(data => {
            if (data.items.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Không tìm thấy Hán tự nào</p></div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            let html = '<div class="kanji-grid">';
            
            data.items.forEach(item => {
                html += `<div class="kanji-card" style="position:relative;" onclick="openKanjiDetail('${esc(item.kanji)}',${item.id})">`;
                const bm = bookmarkMap[item.id] || '';
                if (bm === 'review') html += `<span class="bm-indicator" title="Cần ôn lại">🔖</span>`;
                else if (bm === 'learned') html += `<span class="bm-indicator" title="Đã học">✅</span>`;
                html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">`;
                html += `<span class="level-badge level-${item.level}">${item.level}</span>`;
                if (item.strokes > 0) html += `<span style="color:var(--text-light);font-size:0.85em;">${item.strokes} nét</span>`;
                html += `</div>`;
                
                html += `<div class="kanji-char">${esc(item.kanji)}</div>`;
                html += `<div class="kanji-meaning">${esc(item.meaning)}</div>`;
                
                if (item.meaning_vi) {
                    html += `<div class="kanji-detail">🇻🇳 <strong>${esc(item.meaning_vi)}</strong></div>`;
                }
                if (item.onyomi) {
                    html += `<div class="kanji-detail">🔊 On: <strong>${esc(item.onyomi)}</strong></div>`;
                }
                if (item.kunyomi) {
                    html += `<div class="kanji-detail">🗣️ Kun: <strong>${esc(item.kunyomi)}</strong></div>`;
                }
                
                html += `<div style="margin-top:8px;text-align:center;color:var(--primary);font-size:0.85em;">👆 Click xem chi tiết</div>`;
                html += `</div>`;
            });
            
            html += '</div>';
            html += `<p style="margin-top:16px;color:var(--text-light);font-size:0.9em;text-align:center;">Hiển thị ${data.items.length} / ${data.total} Hán tự</p>`;
            content.innerHTML = html;
            
            renderPagination(data.page, data.pages);
        });
}

function openKanjiDetail(kanji, kanjiId) {
    const modal = document.getElementById('kanjiModal');
    const body = document.getElementById('modalBody');
    modal.style.display = 'flex';
    body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    document.body.style.overflow = 'hidden';
    window._currentKanjiId = kanjiId;
    
    fetch(`/api/kanji/${encodeURIComponent(kanji)}`)
        .then(r => r.json())
        .then(data => {
            let html = '';
            html += `<span class="level-badge level-${data.level}" style="margin-bottom:8px;display:inline-block;">${data.level}</span>`;
            html += `<div class="modal-kanji-char">${esc(data.kanji)}</div>`;
            html += `<div class="modal-meaning">${esc(data.meaning)}</div>`;
            if (data.meaning_vi) html += `<div class="modal-meaning-vi">🇻🇳 ${esc(data.meaning_vi)}</div>`;
            
            // Info grid
            html += `<div class="modal-info-grid">`;
            if (data.onyomi) html += `<div class="modal-info-item"><div class="label">🔊 Âm On (音読み)</div><div class="value">${esc(data.onyomi)}</div></div>`;
            if (data.kunyomi) html += `<div class="modal-info-item"><div class="label">🗣️ Âm Kun (訓読み)</div><div class="value">${esc(data.kunyomi)}</div></div>`;
            if (data.strokes > 0) html += `<div class="modal-info-item"><div class="label">✏️ Số nét (画数)</div><div class="value">${data.strokes} nét</div></div>`;
            html += `</div>`;
            
            // Radical/component analysis
            if (data.radical) {
                html += `<div class="modal-section"><h3>🔤 Bộ thủ & Thành phần (部首)</h3>`;
                html += `<div class="radical-section"><div class="radical-info">`;
                html += `<span class="radical-char">${esc(data.radical.split(' ')[0])}</span>`;
                html += `<div><div class="radical-name">${esc(data.radical)}</div>`;
                html += `</div></div></div>`;
                
                // Show component breakdown if available
                if (data.components && data.components.length > 0) {
                    html += `<div style="margin-top:10px;"><strong>Thành phần:</strong></div>`;
                    html += `<div class="component-list">`;
                    data.components.forEach(comp => {
                        html += `<div class="component-chip"><span class="comp-char">${esc(comp.char)}</span> ${esc(comp.meaning)}</div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }
            
            // Kanji examples
            if (data.examples && data.examples.length > 0) {
                html += `<div class="modal-section"><h3>📚 Ví dụ từ Kanji</h3>`;
                data.examples.forEach(ex => {
                    html += `<div class="vocab-chip"><span class="vword">${esc(ex.word)}</span> <span style="color:var(--text-light);">(${esc(ex.reading)})</span> → ${esc(ex.meaning)}</div>`;
                });
                html += `</div>`;
            }
            
            // Related vocabulary from DB
            if (data.related_vocab && data.related_vocab.length > 0) {
                html += `<div class="modal-section"><h3>📖 Từ vựng liên quan (chứa ${esc(data.kanji)})</h3>`;
                html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
                data.related_vocab.forEach(v => {
                    html += `<div class="vocab-chip">`;
                    html += `<span class="vlevel">${v.level}</span>`;
                    html += `<span class="vword">${esc(v.word)}</span>`;
                    if (v.reading) html += ` <span style="color:var(--text-light);font-size:0.85em;">(${esc(v.reading)})</span>`;
                    html += ` → ${esc(v.meaning)}`;
                    html += `</div>`;
                });
                html += `</div></div>`;
            }
            
            // Bookmark actions
            const curBm = bookmarkMap[window._currentKanjiId] || '';
            html += `<div class="modal-section"><h3>📋 Đánh dấu</h3>`;
            html += `<div class="bm-actions">`;
            html += `<button class="bm-btn bm-review${curBm === 'review' ? ' active' : ''}" onclick="setBookmark(window._currentKanjiId,'review')">🔖 Cần ôn lại</button>`;
            html += `<button class="bm-btn bm-learned${curBm === 'learned' ? ' active' : ''}" onclick="setBookmark(window._currentKanjiId,'learned')">✅ Đã học</button>`;
            if (curBm) html += `<button class="bm-btn bm-clear" onclick="setBookmark(window._currentKanjiId,'')">✕ Xóa đánh dấu</button>`;
            html += `</div></div>`;
            
            body.innerHTML = html;
        })
        .catch(() => {
            body.innerHTML = '<p style="text-align:center;color:var(--danger);">Không thể tải dữ liệu</p>';
        });
}

function setBookmark(itemId, status) {
    fetch('/api/bookmark', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({item_type: 'kanji', item_id: itemId, status: status})
    }).then(r => r.json()).then(data => {
        if (data.success) {
            if (status) bookmarkMap[itemId] = status;
            else delete bookmarkMap[itemId];
            closeModal();
            loadKanji();
        }
    });
}

function closeModal() {
    document.getElementById('kanjiModal').style.display = 'none';
    document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderPagination(page, totalPages) {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page-1})">← Trước</button>`;
    const start = Math.max(1, page - 2);
    const end = Math.min(totalPages, page + 2);
    if (start > 1) html += `<button onclick="goPage(1)">1</button>`;
    if (start > 2) html += `<button disabled>...</button>`;
    for (let i = start; i <= end; i++) {
        html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    if (end < totalPages - 1) html += `<button disabled>...</button>`;
    if (end < totalPages) html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="goPage(${page+1})">Sau →</button>`;
    pag.innerHTML = html;
}

function goPage(p) { currentPage = p; loadKanji(); window.scrollTo(0, 0); }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.querySelectorAll('.level-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentLevel = tab.dataset.level;
        currentPage = 1;
        loadKanji();
    });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentSearch = e.target.value.trim();
        currentPage = 1;
        loadKanji();
    }, 300);
});

document.querySelectorAll('.bm-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.bm-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentBookmark = tab.dataset.bookmark;
        currentPage = 1;
        loadKanji();
    });
});

loadBookmarks().then(() => loadKanji());
</script>
{% endblock %}
